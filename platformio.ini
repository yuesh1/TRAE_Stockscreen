; ============================================================
;  ESP32-C3 A股行情屏
;   环境 main        —— 主固件
;   环境 test_screen —— 屏幕引脚测试固件（候选引脚组轮换）
; ============================================================
[platformio]
default_envs = main

[env]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; 8MB flash 必须同时改 upload.flash_size（写入镜像头的尺寸字节），
; 只设 board_build.flash_size 不生效——bootloader 会按 4MB 校验分区表，
; 官方分区表里 0x700000 的 recovery 区"越界"导致无限复位（真机踩坑实录）
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
; 官方分区布局：factory 3MB（默认 default.csv 的 1.3MB 装不下 BLE 协议栈），
; 且避开 0x700000 的官方 recovery 区。换分区表后 NVS 保存的 WiFi 凭据可能丢失，
; 重新用串口/BLE 配一次即可
board_build.partitions = partitions.csv
; 用项目内 include/User_Setup.h 配置 TFT_eSPI，不改动库文件。
; -include 强制所有编译单元（含 TFT_eSPI 库自身）先包含该配置
build_flags =
    -DUSER_SETUP_LOADED=1
    -Iinclude
    -include User_Setup.h
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    bblanchon/ArduinoJson@^7.3.1
    h2zero/NimBLE-Arduino@^1.4.2
; TFT_eSPI 不在 lib_deps 里：用的是 lib/TFT_eSPI 的本地修改版
; （ESP32-C3 + arduino-esp32 3.x 兼容补丁，见 lib/TFT_eSPI/README_PATCHES.md）

[env:main]
build_src_filter = +<*> -<test_screen.cpp>

[env:test_screen]
build_src_filter = -<*> +<test_screen.cpp>
